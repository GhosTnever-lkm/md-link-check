[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-link-check"
version = "0.1.0"
description = "Offline checker for relative links and heading anchors in Markdown repositories."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
md-link-check = "md_link_check.cli:main"
